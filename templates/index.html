<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DashSpeed — Lane Marking Speed Detector</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- JetBrains Mono from Google Fonts (optional, gracefully falls back) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-shell">

  <!-- ── header ──────────────────────────────────────────────────────────── -->
  <header>
    <span class="logo">Dash<span>Speed</span></span>
    <span class="pill">CV · IPM · OPTICAL FLOW</span>
  </header>

  <!-- ── main ────────────────────────────────────────────────────────────── -->
  <div class="main">

    <!-- LEFT: video ──────────────────────────────────────────────────────── -->
    <div class="video-panel">

      <div class="video-wrap">
        <!-- placeholder shown before any video is uploaded -->
        <div class="placeholder" id="placeholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.2">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M9 10l6 2-6 2V10z"/>
          </svg>
          <p>Upload a dashcam video to begin</p>
        </div>

        <!-- MJPEG stream target -->
        <img id="video-feed" alt="Processed dashcam feed">
      </div>

      <!-- upload progress bar -->
      <div id="upload-progress">
        <div class="bar"></div>
      </div>

      <!-- upload controls -->
      <div class="upload-bar">
        <button class="btn" id="pick-btn">
          <!-- folder icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          Choose video
        </button>

        <span id="file-name">No file selected</span>

        <button class="btn primary" id="upload-btn" disabled>
          <!-- play icon -->
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Analyse
        </button>

        <!-- hidden file input -->
        <input type="file" id="file-input" accept="video/*" style="display:none">
      </div>

      <!-- status row -->
      <div class="status-row">
        <span class="dot idle" id="status-dot"></span>
        <span id="status-text">Ready — upload a dashcam video</span>
      </div>

    </div><!-- /.video-panel -->

    <!-- RIGHT: speed table ───────────────────────────────────────────────── -->
    <div class="data-panel">

      <div class="panel-header">
        <h2>Speed Readings</h2>
        <span id="reading-count">0</span>
      </div>

      <div class="table-wrap">
        <div class="empty-state" id="empty-state">
          Waiting for speed data…<br>
          <span style="opacity:.5">Readings appear every 3 seconds</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Interval</th>
              <th>km/h</th>
              <th>m/s</th>
              <th>Conf.</th>
            </tr>
          </thead>
          <tbody id="speed-tbody"></tbody>
        </table>
      </div>

    </div><!-- /.data-panel -->

  </div><!-- /.main -->
</div><!-- /.app-shell -->

<script src="/static/js/app.js"></script>
</body>
</html>
